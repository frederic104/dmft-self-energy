name: Synthetic data and baseline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,ml]'
      - run: python -m pytest -q
      - run: >-
          ruff check src/dmft_data/hdf.py src/dmft_data/learning
          src/dmft_data/__main__.py tests/test_learning.py
          src/dmft_data/physics.py tests/test_physics.py
          src/dmft_data/iteration_analysis.py tests/test_iteration_analysis.py
          src/dmft_data/plotting.py src/dmft_data/validation_protocol.py
          src/dmft_data/lattice.py tests/test_lattice.py
          scripts/lattice_reference_demo.py
